<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091720">
<meta name="description" content="Hồ sơ 1991 · Phiên giải mã lịch sử. 5 chương thuyết trình và 5 câu hỏi tương tác dành cho một người dẫn.">
<title>Hồ sơ 1991 · Director’s Cut 4.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23081720'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='44' fill='%23e9ba77'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:dark;--navy:#07131d;--navy2:#0d202d;--ink:#f4eee4;--soft:#c9d2d3;--muted:#a9b5ba;--gold:#e9ba77;--gold2:#b68b57;--line:rgba(228,199,154,.22)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;}
body{background:#08141d;color:var(--ink);font-family:Arial,"Segoe UI",sans-serif;font-weight:400;line-height:1.55;font-kerning:normal;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default}a{color:var(--gold)}
button:focus-visible,a:focus-visible{outline:3px solid #f8d693;outline-offset:3px}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex:none}
#root{min-height:100dvh}
.interface{min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 7% 3%,#1d3640 0,transparent 35%),radial-gradient(circle at 90% 96%,#162c35 0,transparent 28%),#07141e;}
.mast{flex:0 0 58px;height:58px;display:flex;align-items:center;gap:18px;border-bottom:1px solid rgba(226,189,131,.18);padding:0 clamp(14px,2.6vw,48px);background:#091720;}
.mast-brand{border:0;background:transparent;display:flex;align-items:center;gap:11px;text-align:left;min-width:192px;padding:2px 0}
.brand-mark{font-size:28px;line-height:1;color:var(--gold)}
.mast-brand b{display:block;color:#f1e6d0;font-size:13px;letter-spacing:.12em;line-height:1.15;font-weight:800}
.mast-brand small{display:block;color:#93a8b1;font-size:9px;letter-spacing:.15em;line-height:1.45;margin-top:5px}
.mast-center{flex:1;text-align:center;color:#8297a2;font-size:11px;letter-spacing:.2em;font-weight:700}
.case-nav{display:flex;align-items:stretch;justify-content:center;flex:1;max-width:780px;gap:5px;height:100%;margin:auto}
.case-tab{display:flex;align-items:center;gap:9px;border:0;border-bottom:2px solid transparent;background:none;padding:0 13px;color:#80929b;font-size:11px;letter-spacing:.04em;white-space:nowrap;transition:background .15s,color .15s}
.case-tab i{font-style:normal;font-weight:800;font-size:11px;color:#b4a481}
.case-tab.active{color:#f2dfb6;border-bottom-color:var(--gold);background:rgba(220,177,109,.08)}
.case-tab.active i{color:#efbd77}.case-tab:hover{color:white;background:rgba(255,255,255,.05)}
.mast-tools{display:flex;align-items:center;gap:7px;margin-left:auto}
.iconbtn{border:1px solid rgba(236,193,134,.25);background:#10242e;border-radius:8px;min-width:37px;height:35px;font-size:18px;line-height:1;display:grid;place-items:center;color:#ddceb7}
.iconbtn:hover{background:#203b46}
.viewport{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:10px 10px;background:repeating-linear-gradient(90deg,transparent 0 63px,rgba(206,186,154,.013) 64px 65px)}
.stage{width:min(100%,calc((100dvh - 118px)*1.7777778));max-width:1900px;aspect-ratio:16/9;flex:none;position:relative;overflow:hidden;isolation:isolate;border:1px solid rgba(217,182,125,.24);box-shadow:0 25px 75px rgba(0,0,0,.5);background:#11232d;container-type:inline-size}
.stage:before{pointer-events:none;position:absolute;inset:0;content:"";background-image:radial-gradient(rgba(240,226,197,.1) .6px,transparent 1px);background-size:7px 7px;opacity:.26;z-index:8}
.slide{position:absolute;inset:0;overflow:hidden;}
.scene-enter{animation:sceneEntrance .38s cubic-bezier(.18,.7,.32,1) both}
@keyframes sceneEntrance{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes enterFromLeft{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes arriveStamp{from{transform:scale(1.6) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
@keyframes strokeReveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.controlbar{height:50px;flex:0 0 50px;background:#091720;border-top:1px solid rgba(226,189,131,.16);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.8vw,50px);color:#97a9b0;gap:12px;font-size:11px}
.control-left,.control-right{display:flex;align-items:center;gap:14px;min-width:240px}
.control-right{justify-content:flex-end}
.footer-btn{border:none;background:none;display:inline-flex;gap:8px;align-items:center;color:#d3c1a1;font-weight:700;padding:10px 0}
.footer-btn:disabled{opacity:.35}
.footer-link{border:0;background:transparent;color:#879fac;padding:10px 0}
.footer-link:hover{color:var(--ink)}
.footer-separator{height:17px;width:1px;background:#31444d}
.control-center{letter-spacing:.13em;color:#a8b4b6;font-weight:700;white-space:nowrap}
.keyhint{white-space:nowrap;letter-spacing:.07em;color:#e4c697}.keyhint em{font-style:normal;letter-spacing:0;color:#8e9ea6}
.version{font-size:10px;color:#78909c}
.eyebrow{color:var(--gold);font-size:1.06cqw;font-weight:800;letter-spacing:.15em;display:flex;align-items:center;gap:1.2cqw;margin:0;line-height:1.5}
.tiny-line{width:2.4cqw;height:2px;background:var(--gold);display:inline-block;flex:none}
.long-line{width:2.4cqw;height:1px;background:#b7a084;display:inline-block}
.action-primary{font-size:1.34cqw;line-height:1.2;border:1px solid #f4d3a3;border-radius:.65cqw;background:linear-gradient(135deg,#f3d7ab,#d5aa74);color:#18212a;min-height:4.35cqw;padding:0 1.8cqw;display:inline-flex;align-items:center;gap:1.5cqw;justify-content:center;font-weight:800;letter-spacing:.015em;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.2);white-space:nowrap;transition:filter .18s,transform .18s}
.action-primary:hover{filter:brightness(1.07);transform:translateY(-2px)}
.action-primary svg{width:1.2em;height:1.2em}
/* home */
.home-view{display:grid;grid-template-columns:57% 43%;background:radial-gradient(ellipse at 25% 12%,#213842 0%,transparent 68%),linear-gradient(130deg,#091923,#0b1b26 62%,#142833)}
.paper-corner{position:absolute;border:1px solid rgba(233,187,119,.33);width:6cqw;height:6cqw;z-index:3;pointer-events:none}.paper-corner.tl{top:1.8cqw;left:1.8cqw;border-right:0;border-bottom:0}.paper-corner.br{bottom:1.8cqw;right:1.8cqw;border-left:0;border-top:0}
.home-left{padding:5.6cqw 0 3.7cqw 5.9cqw;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;position:relative;z-index:2}
.home-overline{font-size:1.24cqw;color:#a2b3b8;letter-spacing:.15em;margin:3.2cqw 0 .1cqw}
.hero-title{font-family:Arial,"Segoe UI",sans-serif;font-weight:850;letter-spacing:.018em;line-height:1.04;font-size:8.5cqw;margin:0 0 2cqw;color:#fff8e8;text-shadow:0 .4cqw 2.5cqw rgba(0,0,0,.2)}
.hero-title span{color:#e9b875}.hero-rule{width:26cqw;height:2px;background:linear-gradient(90deg,#edbb7e,transparent);transform-origin:left;animation:strokeReveal .7s .3s both}
.hero-lead{font-size:1.83cqw;line-height:1.55;max-width:45cqw;color:#d0d9d8;margin:1.8cqw 0}
.hero-lead strong{font-weight:700;color:#f1dab4}
.hero-info{display:flex;gap:1.2cqw;flex-wrap:wrap;margin:.2cqw 0 2.4cqw}
.hero-info span{padding:.8cqw 1cqw;border:1px solid rgba(233,190,125,.25);font-size:1.03cqw;letter-spacing:.02em;color:#b4bec2;background:rgba(255,255,255,.025);white-space:nowrap}
.hero-info b{color:#e4b87d;font-size:1.4cqw;margin-right:.45cqw}
.big-action{min-height:4.7cqw;font-size:1.4cqw}
.onstage-hint{font-size:1.12cqw;color:#a6b4b8;line-height:1.5;margin:1.5cqw 0 0}
.home-right{position:relative;min-width:0;overflow:hidden;background:#192833}
.cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% center;filter:grayscale(.2) brightness(.72) saturate(.6)}
.cover-overlay{position:absolute;inset:0;background:linear-gradient(90deg,#0b1c28 0%,rgba(11,28,40,.23) 34%,rgba(4,13,21,.14)),linear-gradient(0deg,rgba(5,14,21,.94),transparent 42%)}
.cover-label{position:absolute;top:3.6cqw;left:2.3cqw;right:1cqw;color:#f2d3a4;font-size:1cqw;font-weight:700;letter-spacing:.08em}.cover-label span{padding:0 4px}
.cover-caption{position:absolute;bottom:6.4cqw;left:2.9cqw;font-size:1.45cqw;letter-spacing:.1em;line-height:1.65;font-weight:700;color:#e4e7e2}.cover-caption strong{font-size:2.05cqw;color:#f2ca8d}
.cover-credit{position:absolute;bottom:3.7cqw;left:2.9cqw;color:#bac6c3;font-size:.96cqw}
/* chapter intro */
.intro-view{display:grid;grid-template-columns:58% 42%;background:radial-gradient(circle at 30% 0,#243b46,transparent 60%),#0d1f2b}
.chapter-copy{padding:5.5cqw 3.3cqw 4.3cqw 6.2cqw;position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;}
.chapter-watermark{font-size:22cqw;font-weight:800;position:absolute;right:0;top:3.5cqw;line-height:1;color:rgba(230,199,148,.055);z-index:-1;pointer-events:none}
.chapter-kicker{font-size:1.25cqw;letter-spacing:.12em;color:#a9bac0;margin:2.8cqw 0 1.6cqw;font-weight:800}
.chapter-title{font-size:5.3cqw;font-weight:800;line-height:1.21;letter-spacing:0;max-width:52cqw;margin:0 0 1.6cqw;color:#fff7e8;overflow-wrap:break-word;word-break:normal}
.chapter-intro{font-size:1.75cqw;max-width:47cqw;line-height:1.55;color:#cdd5d4;margin:0 0 2.3cqw}
.chapter-signals{display:flex;flex-wrap:wrap;gap:1.8cqw;margin:0 0 2.6cqw;color:#e4cdab;font-size:1.2cqw}
.chapter-signals b{font-size:1.7cqw;color:var(--theme)}
.chapter-art{position:relative;overflow:hidden;background:#253440;padding:2.6cqw 2.6cqw 2.6cqw 0}
.image-scene{position:relative;width:100%;height:100%;background:#23323e;overflow:hidden;isolation:isolate;border:1px solid rgba(241,217,177,.16)}
.image-fallback,.archive-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.image-fallback{filter:saturate(.65) contrast(1.1);background:#1b303d}
.archive-photo{font-size:0;color:transparent;filter:grayscale(.9) sepia(.22) saturate(.7) contrast(1.11) brightness(.78);z-index:1;}
.image-gradient{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,23,35,.26),transparent 38%,rgba(5,16,23,.93) 96%),linear-gradient(90deg,rgba(9,24,33,.13),rgba(9,24,33,.09));z-index:2;pointer-events:none}
.image-tag{position:absolute;top:2.4cqw;left:2cqw;z-index:3;border:1px solid rgba(237,199,144,.56);background:rgba(7,18,29,.48);padding:.6cqw .95cqw;color:#f1d3a4;font-size:1cqw;letter-spacing:.13em;font-weight:800}
.image-tag span{color:#e0b87b;margin:0 4px}
.image-overlay-text{position:absolute;z-index:3;bottom:5.6cqw;left:2.2cqw;font-size:5.2cqw;font-weight:800;letter-spacing:.06em;line-height:1;color:#f4e8d0;text-shadow:0 4px 18px #04101a;max-width:100%;overflow-wrap:break-word}
.image-caption{position:absolute;z-index:3;bottom:1.3cqw;left:1.8cqw;right:1.5cqw;color:#e6e6df;font-size:.95cqw;line-height:1.45;padding-top:.8cqw;border-top:1px solid rgba(231,204,166,.35)}
.image-caption span{color:#bccbc8}
.chapter-side-stamp{position:absolute;z-index:4;bottom:1cqw;right:3.5cqw;font-size:7cqw;font-weight:800;color:rgba(238,205,158,.28);line-height:.8;pointer-events:none}.chapter-side-stamp small{display:block;font-size:1.2cqw;letter-spacing:.2em;text-align:right;margin-top:.5cqw}
/* lesson */
.lesson-view{display:grid;grid-template-columns:43% 57%;background:#0a1b26}
.lesson-visual{padding:3cqw 0 3cqw 3cqw;position:relative;min-height:0}
.lesson-visual .image-overlay-text{font-size:4.4cqw;bottom:5cqw}
.lesson-visual .image-caption{font-size:.87cqw}
.lesson-visual-bottom{position:absolute;z-index:5;right:1.6cqw;top:5.8cqw;background:rgba(9,27,38,.85);border-left:3px solid var(--theme);width:20cqw;padding:1.25cqw;backdrop-filter:blur(8px);box-shadow:0 8px 35px rgba(0,0,0,.22)}
.lesson-visual-bottom span{display:block;color:#afc1c2;letter-spacing:.08em;font-size:.91cqw;font-weight:800;margin-bottom:.7cqw}
.lesson-visual-bottom strong{font-size:1.45cqw;line-height:1.25;color:#f0d2a3;font-weight:800;overflow-wrap:break-word}
.lesson-story{min-width:0;padding:5cqw 4.3cqw 4cqw 5cqw;display:flex;flex-direction:column;justify-content:center;position:relative}
.lesson-story:before{content:"";position:absolute;left:0;top:12%;height:76%;width:1px;background:linear-gradient(transparent,rgba(235,195,133,.3),transparent)}
.story-counter{font-weight:750;letter-spacing:.12em;font-size:1.25cqw;margin:3.5cqw 0 1cqw;color:#a3b3b6}
.story-counter b{font-size:2.35cqw;color:var(--theme);padding-left:.8cqw}.story-counter span{font-size:1.4cqw;color:#b2a38b;margin-left:.6cqw}
.story-heading{font-size:4.1cqw;font-weight:800;line-height:1.23;letter-spacing:0;margin:0 0 2.5cqw;color:#fff6e9;max-width:49cqw;overflow-wrap:break-word;word-break:normal}
.story-body{font-size:2.22cqw;line-height:1.52;max-width:48cqw;color:#d6dfdc;margin:0 0 3cqw}
.story-progress{display:flex;gap:.8cqw;width:100%;margin:0 0 2.5cqw}
.fact-track{flex:1;padding:0;border:0;height:8px;background:#2b3c43;position:relative;border-radius:50px;overflow:hidden}
.fact-track span{height:100%;width:0;background:var(--theme);display:block;transition:width .3s}
.fact-track.current span,.fact-track.done span{width:100%}
.fact-track.done span{opacity:.56}
.story-footer{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.reading-note{font-size:1.13cqw;color:#a0b1b8;line-height:1.55;max-width:22cqw}
/* challenge */
.challenge-view{background:radial-gradient(circle at 70% 16%,rgba(190,147,89,.09),transparent 45%),linear-gradient(140deg,#0c202c,#091822 70%);padding:4cqw 5.6cqw 3cqw;display:flex;flex-direction:column}
.challenge-top{display:flex;justify-content:space-between;align-items:flex-start;gap:1cqw}
.trial-indicator{font-weight:800;font-size:1.06cqw;color:#a2b2b6;letter-spacing:.08em;margin:1.1cqw 0 0}
.trial-indicator strong{font-size:1.6cqw;color:var(--theme)}
.challenge-icon{border:1px solid rgba(235,201,153,.27);padding:.7cqw 1.2cqw;color:var(--gold);font-size:1.4cqw;white-space:nowrap}.challenge-icon span{font-size:1.06cqw;letter-spacing:.12em;margin-left:8px}
.challenge-question{font-size:3.14cqw;font-weight:800;line-height:1.25;color:#fff4e5;max-width:88cqw;margin:1.4cqw 0 .5cqw;letter-spacing:0;overflow-wrap:break-word}
.challenge-hint{font-size:1.27cqw;color:#b6c3c6;margin:0 0 2.1cqw}
.answer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.45cqw;flex:1;min-height:0;max-height:22cqw;}
.answer-file{position:relative;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid rgba(231,197,147,.34);background:linear-gradient(155deg,#20313b,#152531);padding:1.7cqw 1.8cqw;transition:background .18s,border-color .18s,transform .18s;overflow:hidden}
.answer-file:before{content:"";width:4cqw;height:4cqw;position:absolute;right:-1.8cqw;top:-1.8cqw;transform:rotate(45deg);background:rgba(221,183,123,.08);border-bottom:1px solid rgba(218,174,115,.22)}
.answer-file:not(:disabled):hover{border-color:#f2c88f;transform:translateY(-4px);background:linear-gradient(150deg,#29414c,#1c303d)}
.answer-mark{font-weight:800;color:#d4b485;border:1px solid rgba(216,180,124,.33);padding:.25cqw .75cqw;font-size:1.08cqw;line-height:1.3}
.answer-content{display:flex;flex-direction:column;gap:1cqw;margin:auto 0;width:100%}
.answer-short{color:#d0a66e;font-size:1.05cqw;letter-spacing:.1em;font-weight:800;line-height:1.4}
.answer-title{font-size:1.58cqw;line-height:1.42;font-weight:700;color:#f4eee7;overflow-wrap:break-word;word-break:normal}
.answer-tick{align-self:flex-end;color:#d6b582;font-size:2cqw;line-height:1}
.answer-file.correct{border-color:#a3cfb5;background:linear-gradient(150deg,#284a44,#19362e)}
.answer-file.incorrect{border-color:#cf9185;background:linear-gradient(150deg,#4a2f33,#302329)}
.answer-file.dimmed{opacity:.38}
.participation-tip{margin-top:2cqw;border-top:1px solid rgba(223,186,134,.22);padding-top:1.5cqw;color:#b4c4c7;font-size:1.25cqw;display:flex;gap:1cqw;align-items:center}
.participation-tip strong{color:#edc68f}.tip-pulse{color:#edc68f;font-size:1.5cqw}
.verdict-zone{margin-top:1.4cqw;min-height:10cqw;border:1px solid rgba(214,185,140,.36);background:rgba(6,18,26,.9);display:grid;grid-template-columns:14cqw minmax(0,1fr) auto;align-items:center;gap:2cqw;padding:1.45cqw 2cqw}
.reveal-once{animation:sceneEntrance .25s ease-out both}
.verdict-stamp{font-size:1.6cqw;font-weight:850;letter-spacing:.02em;line-height:1.18;text-align:center;border:3px solid;padding:1cqw .8cqw;transform:rotate(-6deg);animation:arriveStamp .38s ease-out both}
.verdict-stamp.approved{border-color:#9cc9ad;color:#afd8bd}.verdict-stamp.rejected{border-color:#d49b90;color:#e3aba0}
.verdict-copy{min-width:0}.verdict-copy b{font-size:1.07cqw;letter-spacing:.15em;color:var(--gold)}
.verdict-copy p{font-size:1.28cqw;line-height:1.4;margin:.55cqw 0 0;color:#d5dcda}
.verdict-next{font-size:1.05cqw;min-height:3.9cqw;padding:0 1.3cqw}
/* outro */
.outro-view{display:grid;grid-template-columns:55% 45%;background:linear-gradient(125deg,#102631,#091923)}
.outro-left{padding:6cqw 4cqw 4cqw 5.5cqw;display:flex;flex-direction:column;justify-content:center}
.outro-left h2{font-size:5cqw;line-height:1.18;letter-spacing:0;font-weight:850;margin:2.5cqw 0;color:#fff4e6}
.outro-left h2 span{color:var(--gold)}
.outro-line{height:2px;width:24cqw;background:linear-gradient(90deg,var(--gold),transparent);margin-bottom:1.9cqw;transform-origin:left;animation:strokeReveal .8s both}
.outro-left p{font-size:1.65cqw;color:#d4ddda;line-height:1.55;max-width:43cqw;margin:0 0 1.5cqw}
.outro-footnote{font-size:1.17cqw;color:#a8b9bc;line-height:1.45;max-width:44cqw;padding-left:1.2cqw;border-left:2px solid var(--gold);margin-bottom:2cqw}
.outro-left .action-primary{align-self:flex-start}
.outro-right{position:relative;border-left:1px solid var(--line);padding:4.2cqw 3.4cqw 3cqw;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 40% 35%,rgba(229,180,109,.1),transparent 65%)}
.outro-board-head{font-size:1.1cqw;letter-spacing:.13em;font-weight:800;color:#d0ad7c;text-align:center;margin:0 0 1.8cqw}
.cause-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw;position:relative;}
.cause-card{min-height:11cqw;border:1px solid rgba(231,185,117,.26);background:#1a3039;padding:1.4cqw;display:flex;flex-direction:column;justify-content:space-between;animation:sceneEntrance .45s both}
.cause-card:nth-child(2){animation-delay:.12s}.cause-card:nth-child(3){animation-delay:.24s}.cause-card:nth-child(4){animation-delay:.36s}
.cause-card span{font-size:1cqw;font-weight:800;color:#d9b37c}

    <p class="home-overline">HỒ SƠ GIẢI MÃ / 1985—1991</p>
    <h1 class="hero-title">HỒ SƠ<br><span>1991</span></h1>
    <div class="hero-rule"></div>
    <p class="hero-lead">Một cuộc khủng hoảng. Nhiều nguyên nhân.<br><strong>Liệu bạn có tìm được lời giải?</strong></p>
    <div class="hero-info"><span><b>05</b> CHƯƠNG KIẾN THỨC</span><span><b>05</b> CÂU HỎI QUYẾT ĐỊNH</span><span><b>01</b> NGƯỜI DẪN</span></div>
    <button class="action-primary big-action" data-action="start">MỞ HỒ SƠ ĐẦU TIÊN ${arrow}</button>
    <p class="onstage-hint">Bạn trình bày trước · Chỉ mở câu hỏi khi cả lớp đã hiểu nội dung.</p>
  </div>
  <div class="home-right">
    <img src="${assets.cover}" class="cover-img" alt="Minh họa biểu tượng ngôi sao đỏ đổ vỡ và bản đồ châu Âu">
    <div class="cover-overlay"></div>
    <div class="cover-label">CHUYÊN ĐỀ MLN131 <span>•</span> KHỦNG HOẢNG LIÊN XÔ – ĐÔNG ÂU</div>
    <div class="cover-caption">LỊCH SỬ KHÔNG CHỈ CÓ<br><strong>MỘT NGUYÊN NHÂN.</strong></div>
    <span class="cover-credit">Đồ họa minh họa, không phải ảnh tư liệu.</span>
  </div>
 </section>`;
}
function intro(){
 const c=chapters[state.index];
 return `<section class="slide intro-view scene-enter" aria-label="Giới thiệu ${esc(c.id)}" style="--theme:${c.theme}">
  <div class="chapter-copy">
    <p class="eyebrow">${esc(c.tag)}<span class="long-line"></span> PHẦN ${esc(state.index+1)} / 5</p>
    <div class="chapter-watermark" aria-hidden="true">${esc(c.chapter)}</div>
    <p class="chapter-kicker">MỞ HỒ SƠ ĐIỀU TRA</p>
    <h2 class="chapter-title">${esc(c.title)}</h2>
    <p class="chapter-intro">${esc(c.intro)}</p>
    <div class="chapter-signals"><span><b>03</b> lớp bằng chứng</span><span><b>01</b> câu hỏi cuối chương</span></div>
    <button class="action-primary" data-action="open-lesson">MỞ PHẦN GIẢNG ${arrow}</button>
  </div>
  <div class="chapter-art">${art(c)}<div class="chapter-side-stamp">${esc(c.chapter)}<small>HỒ SƠ</small></div></div>
 </section>`;
}
function lesson(){
 const c=chapters[state.index],e=c.evidences[state.evidence];
 return `<section class="slide lesson-view scene-enter" aria-label="Nội dung chương ${esc(c.chapter)}" style="--theme:${c.theme}">
 <div class="lesson-visual">${art(c)}<div class="lesson-visual-bottom"><span>TRỌNG TÂM CẦN NHỚ</span><strong>${esc(e.keyword)}</strong></div></div>
 <div class="lesson-story">
  <div class="eyebrow"><span class="tiny-line"></span>${esc(c.tag)}</div>
  <p class="story-counter">BẰNG CHỨNG <b>0${state.evidence+1}</b><span>/ 03</span></p>
  <h2 class="story-heading">${esc(e.head)}</h2>
  <p class="story-body">${esc(e.lead)}</p>
  <div class="story-progress">${c.evidences.map((v,i)=>`<button data-fact="${i}" title="Xem bằng chứng ${i+1}" aria-label="Bằng chứng ${i+1}" class="fact-track ${i===state.evidence?'current':i<state.evidence?'done':''}"><span></span></button>`).join('')}</div>
  <div class="story-footer"><span class="reading-note">Hãy giải thích nội dung này cho lớp trước khi chuyển tiếp.</span>
  <button class="action-primary" data-action="next-fact">${state.evidence===2?'MỞ CÂU HỎI':'BẰNG CHỨNG TIẾP THEO'} ${arrow}</button></div>
 </div>
 </section>`;
}
function challenge(){
 const c=chapters[state.index],hasAnswered=state.choice!==null,answeredRight=state.choice===c.correct;
 return `<section class="slide challenge-view scene-enter" aria-label="Thử thách chương ${esc(c.chapter)}" style="--theme:${c.theme}">
  <div class="challenge-top"><div><p class="eyebrow"><span class="tiny-line"></span>${esc(c.tag)}</p><p class="trial-indicator">PHIÊN ĐỐI CHẤT <strong>0${state.index+1}</strong> / 05</p></div><span class="challenge-icon">◈ <span>CHỈ 1 CÂU HỎI</span></span></div>
  <h2 class="challenge-question">${esc(c.question)}</h2>
  <p class="challenge-hint">${esc(c.hint)}</p>
  <div class="answer-grid ${hasAnswered?'answer-complete':''}">
  ${c.answers.map((a,i)=>`<button class="answer-file ${hasAnswered?(i===c.correct?'correct':i===state.choice?'incorrect':'dimmed'):''}" data-choice="${i}" ${hasAnswered?'disabled':''} aria-label="Chọn ${esc(a.title)}"><span class="answer-mark">${['I','II','III'][i]}</span><span class="answer-content"><span class="answer-short">${esc(a.short)}</span><span class="answer-title">${esc(a.title)}</span></span><span class="answer-tick">${hasAnswered?(i===c.correct?'✓':i===state.choice?'×':''):'↗'}</span></button>`).join('')}
  </div>
  ${hasAnswered?`<div class="verdict-zone reveal-once"><div class="verdict-stamp ${answeredRight?'approved':'rejected'}">${answeredRight?'CHÍNH XÁC':'CẦN XEM LẠI'}</div><div class="verdict-copy"><b>GIẢI MÃ LỜI GIẢI</b><p>${esc(c.resolution)}</p></div><button class="action-primary verdict-next" data-action="next-chapter">${state.index===4?'MỞ KẾT LUẬN':'HỒ SƠ TIẾP THEO'} ${arrow}</button></div>`:
  `<div class="participation-tip"><span class="tip-pulse">◉</span><span>Mời cả lớp trả lời bằng lời. <strong>Bạn chỉ bấm một đáp án</strong> để mở lời giải ngay lập tức.</span></div>`}
 </section>`;
}
function outro(){
 const cards=[{name:'KINH TẾ',detail:'Cơ chế thiếu linh hoạt',i:'01'},{name:'CHÍNH TRỊ',detail:'Hạn chế quản trị',i:'02'},{name:'CẢI TỔ',detail:'Thiếu đồng bộ',i:'03'},{name:'QUỐC TẾ',detail:'Sức ép cạnh tranh',i:'04'}];
 return `<section class="slide outro-view scene-enter" aria-label="Kết luận">
   <div class="outro-left"><p class="eyebrow"><span class="tiny-line"></span>KẾT THÚC PHIÊN GIẢI MÃ</p><h2>Không có<br><span>một nguyên nhân</span><br>duy nhất.</h2><div class="outro-line"></div><p>Bốn nhóm nguyên nhân tác động qua lại, góp phần dẫn đến cuộc khủng hoảng và sự tan rã của Liên Xô và các nước xã hội chủ nghĩa Đông Âu.</p><div class="outro-footnote">Đây là kết luận về những mô hình lịch sử cụ thể, không phải một phán quyết tự động về toàn bộ học thuyết.</div><button class="action-primary" data-action="restart">XEM LẠI TỪ ĐẦU ${arrow}</button></div>
   <div class="outro-right"><p class="outro-board-head">BẢNG TỔNG HỢP / 04 NHÓM NGUYÊN NHÂN</p><div class="cause-grid">${cards.map(x=>`<div class="cause-card"><span>${x.i}</span><b>${x.name}</b><small>${x.detail}</small></div>`).join('')}</div><div class="center-node"><strong>TÁC ĐỘNG<br>QUA LẠI</strong></div><p class="outro-board-bottom">GHI NHỚ: MỘT MÔ HÌNH CỤ THỂ ≠ TOÀN BỘ HỌC THUYẾT</p></div>
 </section>`;
}
function modals(){
 if(!state.notes && !state.help && !state.sources)return '';
 let title='',content='';
 if(state.notes){
  const c=chapters[state.index];title='GHI CHÚ NGƯỜI THUYẾT TRÌNH';
  if(state.page==='lesson')content=`<div class="modal-highlight">${esc(c.evidences[state.evidence].head)}</div><p>${esc(c.evidences[state.evidence].note)}</p>`;
  else if(state.page==='challenge')content=`<div class="modal-highlight">Câu hỏi cần nhấn mạnh</div><p>${esc(c.question)}</p><p><b>Đáp án đúng (chỉ dành cho người dẫn):</b> ${esc(c.answers[c.correct].title)}</p><p>${esc(c.resolution)}</p>`;
  else if(state.page==='intro')content=`<div class="modal-highlight">Mở đầu chương ${esc(c.chapter)}</div><p>${esc(c.intro)}</p><p>Thuyết trình xong ba lớp bằng chứng rồi mới mở câu hỏi. Người dẫn bấm chọn thay cho lớp.</p>`;
  else content=`<p>Game dành cho một người thuyết trình. Mỗi chương có ba lớp kiến thức xuất hiện lần lượt và đúng một câu hỏi ở cuối. Không có điểm số hay hệ thống bonus.</p>`;
 }else if(state.help){title='HƯỚNG DẪN TRÌNH CHIẾU';content=`<div class="help-grid"><div><kbd>SPACE</kbd><span>Chuyển tiếp / mở bằng chứng</span></div><div><kbd>← →</kbd><span>Quay lại / chuyển tiếp</span></div><div><kbd>1—5</kbd><span>Nhảy tới chương tương ứng</span></div><div><kbd>N</kbd><span>Xem ghi chú dành cho người dẫn</span></div><div><kbd>F</kbd><span>Bật hoặc thoát toàn màn hình</span></div><div><kbd>ESC</kbd><span>Đóng ghi chú / trợ giúp</span></div></div><p>Ở màn câu hỏi, <b>Space không tự lộ đáp án</b>. Chỉ khi bạn chọn một phương án, lời giải mới xuất hiện.</p><p>Ảnh tư liệu được tải trực tuyến nếu có mạng. Khi mất mạng, minh họa đồ họa vẫn hiện.</p>`;
 }else {title='TƯ LIỆU VÀ GIẤY PHÉP';content=`<p>Đề cương lý thuyết: nhóm nội dung 3.1–3.5 trong tài liệu MLN131 do nhóm cung cấp. Ảnh tư liệu bên dưới tải từ Wikimedia Commons khi có Internet:</p><ul class="source-links"><li><a href="https://commons.wikimedia.org/wiki/File:RIAN_archive_865510_2nd_Watch-Making_Factory_Slava.jpg" target="_blank" rel="noopener noreferrer">Nhà máy Slava, Moskva 1980</a> — Yaroslavtsev / RIA Novosti, CC BY-SA 3.0.</li><li><a href="https://commons.wikimedia.org/wiki/File:Wybory_1989.jpg" target="_blank" rel="noopener noreferrer">Phong trào Đoàn kết Ba Lan 1989</a> — xem giấy phép trên trang ảnh.</li><li><a href="https://commons.wikimedia.org/wiki/File:Mikhail_Gorbachev_1987.jpg" target="_blank" rel="noopener noreferrer">Gorbachev tại Nhà Trắng 1987</a> — White House Photo Office, public domain.</li><li><a href="https://commons.wikimedia.org/wiki/File:SS-20_Pioneer_%26_Pershing-II_Missiles.jpg" target="_blank" rel="noopener noreferrer">Tên lửa SS-20 và Pershing II tại bảo tàng</a> — Cliff, 2008; CC BY 2.0.</li><li><a href="https://commons.wikimedia.org/wiki/File:BerlinWall.jpg" target="_blank" rel="noopener noreferrer">Bức tường Berlin 1989</a> — Stefan Richter, CC BY-SA 3.0.</li></ul><p>Hình nền minh họa được tạo bằng AI; đồ họa vector mang tính biểu tượng, không phải ảnh chụp sự kiện.</p><p>Nguồn tham khảo bối cảnh: <a href="https://history.state.gov/milestones/1989-1992/fall-of-communism" target="_blank" rel="noopener noreferrer">Office of the Historian (U.S. Department of State)</a> và giáo trình <i>Chủ nghĩa xã hội khoa học</i> (Bộ GD&amp;ĐT, 2021).</p>`;}
 return `<div class="modal-backdrop" data-action="close"><div class="modal-panel" role="dialog" aria-modal="true" aria-label="${title}" data-modal="panel"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-action="close" aria-label="Đóng">✕</button></div><div class="modal-content">${content}</div></div></div>`;
}
function render(){
 let screen= state.page==='home'?home():state.page==='intro'?intro():state.page==='lesson'?lesson():state.page==='challenge'?challenge():outro();
 root.innerHTML=`<div class="interface">${header()}<main class="viewport"><div id="stage" class="stage">${screen}</div></main>${footer()}</div>${modals()}`;
 document.title=`Hồ sơ 1991 · ${state.page==='home'?'Mở đầu':state.page==='outro'?'Kết luận':chapters[state.index].id} · 4.0`;
}
function go(page){state.page=page;state.choice=null;render();}
function forward(){
 if(state.notes||state.sources||state.help)return;
 switch(state.page){case 'home':go('intro');break;case 'intro':state.evidence=0;go('lesson');break;case 'lesson':if(state.evidence<2){state.evidence++;render()}else go('challenge');break;case 'challenge':if(state.choice!==null)nextChapter();break;case 'outro':go('home');break;}
}
function backward(){
 if(state.notes||state.sources||state.help)return;
 switch(state.page){case 'home':break;case 'intro':if(state.index===0)go('home');else{state.index--;state.evidence=2;go('challenge')}break;case 'lesson':if(state.evidence>0){state.evidence--;render()}else go('intro');break;case 'challenge':state.evidence=2;go('lesson');break;case 'outro':state.index=4;go('challenge');break;}
}
function nextChapter(){if(state.index<4){state.index++;state.evidence=0;go('intro')}else go('outro');}
root.addEventListener('click', async ev=>{
 const target=ev.target.closest('[data-action],[data-jump],[data-fact],[data-choice]');
 if(!target)return;
 if(ev.target.closest('[data-modal="panel"]') && target.dataset.action==='close' && target.classList.contains('modal-backdrop'))return;
 if(target.dataset.choice!==undefined){if(state.page==='challenge'&&state.choice===null){state.choice=Number(target.dataset.choice);render()}return;}
 if(target.dataset.fact!==undefined){state.evidence=Number(target.dataset.fact);render();return;}
 if(target.dataset.jump!==undefined){state.index=Number(target.dataset.jump);state.evidence=0;go('intro');return;}
 const a=target.dataset.action;
 if(a==='close'){state.notes=false;state.help=false;state.sources=false;render();return;}
 if(a==='notes'||a==='help'||a==='sources'){state.notes=a==='notes';state.help=a==='help';state.sources=a==='sources';render();return;}
 if(a==='home'||a==='restart'){state.index=0;state.evidence=0;go('home');return;}
 if(a==='start'){state.index=0;go('intro');return;}
 if(a==='open-lesson'){state.evidence=0;go('lesson');return;}
 if(a==='next-fact'){forward();return;}
 if(a==='next-chapter'){nextChapter();return;}
 if(a==='back'){backward();return;}
 if(a==='full'){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){console.warn(e)}return;}
});
document.addEventListener('keydown',async ev=>{
 if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
 const overlay=state.notes||state.help||state.sources;
 if(ev.key==='Escape'&&overlay){state.notes=false;state.help=false;state.sources=false;render();return;}
 if(overlay)return;
 if(ev.key==='n'||ev.key==='N'){ev.preventDefault();state.notes=true;render();return;}
 if(ev.key==='f'||ev.key==='F'){ev.preventDefault();try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){}return;}
 if('12345'.includes(ev.key) && ev.key.length===1){ev.preventDefault();state.index=Number(ev.key)-1;state.evidence=0;go('intro');return;}
 if(ev.code==='Space'||ev.key==='ArrowRight'){if(ev.target?.tagName==='BUTTON'&&ev.code==='Space')return;ev.preventDefault();forward();return;}
 if(ev.key==='ArrowLeft'){ev.preventDefault();backward();return;}
});
render();
</script></body>
</html>
