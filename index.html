  function challengeEconomy(){const seq=state.challenge.seq||[];challengeShell(`<h2 class="challenge-title">Tại sao hoàn thành chỉ tiêu vẫn có thể dẫn đến trì trệ?</h2><p class="challenge-instruction">${current().challenge.desc}</p><div class="chain-work">${Array.from({length:4},(_,i)=>`<div class="chain-slot"><b>0${i+1}</b><span>${seq[i]?esc(c1items.find(x=>x.id===seq[i]).t):'Chưa đặt mắt xích'}</span></div>`).join('')}</div><div class="choice-list">${c1items.map(x=>`<button class="choice ${seq.includes(x.id)?'selected':''}" data-action="chainPick" data-value="${x.id}" ${seq.includes(x.id)?'disabled':''}><span class="circle">${seq.includes(x.id)?'✓':'+'}</span>${x.t}</button>`).join('')}</div><div class="stage-hint">Đã chọn ${seq.length}/4 mắt xích · Bấm “Làm lại” nếu cần đổi thứ tự.</div>${feedback()}<div class="challenge-cta"><button class="primary" data-action="chainCheck" ${seq.length!==4?'disabled style="opacity:.45;cursor:not-allowed"':''}>KIỂM TRA CHUỖI ${nextIcon}</button>${footerChallenge()}</div>`)}
  function challengePolitics(){const selected=state.challenge.selected||[];challengeShell(`<h2 class="challenge-title">Những dấu hiệu nào thuộc khủng hoảng chính trị?</h2><p class="challenge-instruction">${current().challenge.desc} Các thẻ còn lại thuộc lĩnh vực khác hoặc là một thành tựu lịch sử.</p><div class="choice-list">${evidences.map((x,i)=>`<button class="choice ${selected.includes(x.id)?'selected':''}" data-action="evidence" data-value="${x.id}"><span class="circle">${selected.includes(x.id)?'✓':String(i+1).padStart(2,'0')}</span>${x.t}</button>`).join('')}</div><div class="stage-hint">Đã chọn ${selected.length}/3 mẩu chứng cứ.</div>${feedback()}<div class="challenge-cta"><button class="primary" data-action="evidenceCheck" ${selected.length!==3?'disabled style="opacity:.45;cursor:not-allowed"':''}>GIẢI MÃ CHỨNG CỨ ${nextIcon}</button>${footerChallenge()}</div>`)}
  function challengeReform(){const ch=state.challenge,from=ch.from,links=ch.links||{};challengeShell(`<h2 class="challenge-title">Cải tổ: ba diễn biến, ba vấn đề cần giải thích</h2><p class="challenge-instruction">${current().challenge.desc} Các cặp thể hiện <b>mối liên hệ để phân tích</b>, không phải khẳng định quan hệ nhân quả duy nhất.</p><div class="pairs"><div class="pairs-column"><div class="pairs-header">01 · DIỄN BIẾN</div>${pairLeft.map(x=>`<button class="choice pair-item ${from===x.id?'selected':''} ${links[x.id]?'paired':''}" data-action="pairLeft" data-value="${x.id}"><span class="circle">${links[x.id]?'✓':'→'}</span>${x.t}</button>`).join('')}</div><div class="pairs-column"><div class="pairs-header">02 · HỆ QUẢ / VẤN ĐỀ</div>${pairRight.map(x=>`<button class="choice pair-item ${Object.values(links).includes(x.id)?'paired':''}" data-action="pairRight" data-value="${x.id}"><span class="circle">${Object.values(links).includes(x.id)?'✓':'+'}</span>${x.t}</button>`).join('')}</div></div><div class="stage-hint">Đã ghép ${Object.keys(links).length}/3 cặp. Chọn thẻ bên trái trước rồi chọn bên phải.</div>${feedback()}<div class="challenge-cta"><button class="primary" data-action="pairCheck" ${Object.keys(links).length!==3?'disabled style="opacity:.45;cursor:not-allowed"':''}>ĐỐI CHIẾU HỒ SƠ ${nextIcon}</button>${footerChallenge()}</div>`)}
  function challengeInternational(){const b=state.budget,rest=100-b.def-b.tech;let s1=b.records[0],s2=b.records[1];challengeShell(`<h2 class="challenge-title">100 đơn vị nguồn lực, bạn sẽ cân đối thế nào?</h2><p class="challenge-instruction">Đây là mô hình <b>giả định</b> để minh họa đánh đổi, không phải ngân sách hay phương án chính sách có thật của Liên Xô.</p><div class="allocation"><div class="allocation-panel"><div class="allocation-row"><div class="line"><span>Quốc phòng – an ninh</span><span id="val-def">${b.def}</span></div><input type="range" min="5" max="75" step="5" data-range="def" value="${b.def}" aria-label="Nguồn lực quốc phòng"></div><div class="allocation-row"><div class="line"><span>Khoa học – công nghệ</span><span id="val-tech">${b.tech}</span></div><input type="range" min="5" max="75" step="5" data-range="tech" value="${b.tech}" aria-label="Nguồn lực khoa học công nghệ"></div><div class="allocation-row"><div class="line"><span>Sản xuất – dân sinh (phần còn lại)</span><span id="val-rest">${rest}</span></div><div class="stage-hint">Tổng cộng luôn là 100. Nếu hai ưu tiên đầu tăng, phần dành cho dân sinh sẽ giảm.</div></div><div class="actions"><button class="primary" data-action="saveBudget" ${b.records.length===2?'disabled style="opacity:.4;cursor:not-allowed"':''}>${b.records.length===0?'LƯU PHƯƠNG ÁN A':'LƯU PHƯƠNG ÁN B'} ${nextIcon}</button></div></div><div class="allocation-panel" style="display:flex;flex-direction:column;justify-content:center"><div class="point-label">ĐIỂM NGUỒN LỰC CÒN LẠI</div><div class="allocation-balance" id="rest-big">${rest}</div><p class="allocation-explain">Dành cho sản xuất – dân sinh.<br><br>Không có “đáp án tối ưu” được suy ra từ mô phỏng này. Hãy dùng nó để thảo luận về <b>chi phí cơ hội</b>.</p></div></div>${b.records.length?`<div class="comparison">${b.records.map((v,i)=>`<div class="compare-item"><strong>Phương án ${i===0?'A':'B'}</strong><div>Quốc phòng: ${v.def} · Công nghệ: ${v.tech} · Dân sinh: ${v.rest}</div></div>`).join('')}</div>`:''}<div class="stage-hint">Hãy lưu 2 phương án khác nhau để mở phần nhận xét.</div>${feedback()}<div class="challenge-cta">${b.records.length===2?`<button class="primary" data-action="budgetCompare">PHÂN TÍCH ĐÁNH ĐỔI ${nextIcon}</button>`:''}${footerChallenge()}</div>`)}
  function challengeSynthesis(){const sel=state.challenge.roleSelected,linked=state.challenge.roles||{};challengeShell(`<h2 class="challenge-title">Bốn nguyên nhân góp phần vào khủng hoảng theo cách nào?</h2><p class="challenge-instruction">${current().challenge.desc} Chọn thẻ nguyên nhân, sau đó chọn ô vai trò tương ứng.</p><div class="nodegrid">${roleItems.map(x=>`<button class="tappable-node ${sel===x.id?'selected':''}" data-action="rolePick" data-value="${x.id}">${x.label}${Object.values(linked).includes(x.id)?' ✓':''}</button>`).join('')}</div><div class="nodegrid">${roles.map(x=>`<button class="role-card ${linked[x.id]?'assigned':''}" data-action="rolePlace" data-value="${x.id}"><strong>${x.title}</strong><span>${x.desc}</span><span style="font-weight:800;color:${linked[x.id]?'#b4dbca':'#899fa4'}">${linked[x.id]?roleItems.find(y=>y.id===linked[x.id]).label:'Chưa ghép'}</span></button>`).join('')}</div><div class="stage-hint">Đã kết nối ${Object.keys(linked).length}/4 vai trò · Lớp hãy giải thích vì sao không thể quy sự tan rã cho một nguyên nhân duy nhất.</div>${feedback()}<div class="challenge-cta"><button class="primary" data-action="roleCheck" ${Object.keys(linked).length!==4?'disabled style="opacity:.45;cursor:not-allowed"':''}>THẨM ĐỊNH KẾT LUẬN ${nextIcon}</button>${footerChallenge()}</div>`)}
  function challengeScreen(){if(state.chapter===0)return challengeEconomy();if(state.chapter===1)return challengePolitics();if(state.chapter===2)return challengeReform();if(state.chapter===3)return challengeInternational();return challengeSynthesis()}
  function debriefScreen(){const c=current();layout(`<div class="screen-head"><div><span class="eyebrow">HỒ SƠ ${c.num} / KẾT QUẢ PHÂN TÍCH</span><h1 class="title-serif screen-heading">Mở khóa kết luận</h1></div><div class="fine-side">Phần người thuyết trình tổng kết</div></div><div class="chapter-grid"><div class="chapter-sheet"><div class="eyebrow">LUẬN ĐIỂM THEN CHỐT</div><h2 class="title-serif chapter-heading" style="font-size:clamp(34px,4vw,61px)">${c.challenge.title}</h2><p class="chapter-desc" style="font-size:clamp(17px,1.75vw,24px)">${c.challenge.solution}</p><div class="actions"><button class="primary" data-action="advance">${state.chapter===4?'MỞ KẾT LUẬN CHUNG':'HỒ SƠ TIẾP THEO'} ${nextIcon}</button></div></div><div class="art-panel" style="background-image:url(${fallbackArt[c.photo]})">${photoImg(c.photo)}<div class="photo-label" style="font-size:27px">${c.caption}</div>${photoCredit(c.photo)}</div></div>${bottom(`<button class="secondary" data-action="challenge">← Xem lại thử thách</button>`,`<button class="primary" data-action="advance">TIẾP TỤC ${nextIcon}</button>`)}`)}
  function ending(){layout(`<div class="epilogue"><span class="eyebrow">HỒ SƠ ĐÃ GIẢI MÃ / KẾT THÚC PHẦN 3</span><h1>Không có <span style="color:var(--gold)">một nguyên nhân duy nhất.</span></h1><p>Sự tan rã của Liên Xô và Đông Âu là kết quả của những hạn chế kinh tế, chính trị, các vấn đề trong cải tổ và sức ép quốc tế <b>tác động qua lại</b> trong một hoàn cảnh lịch sử cụ thể.</p><div class="divider-mark"></div><p style="font-size:17px">Từ đây, câu hỏi tiếp theo của nhóm là: sự thất bại của một mô hình lịch sử có đồng nghĩa với việc phủ định toàn bộ học thuyết chủ nghĩa xã hội?</p><div class="actions"><button class="primary" data-action="home">TRỞ VỀ TRANG ĐẦU ${nextIcon}</button><button class="secondary" data-action="goto" data-value="0">Xem lại 5 hồ sơ</button><button class="secondary" data-action="sources">Nguồn ảnh & nội dung</button></div></div>`,false)}
  function modalHtml(){const c=current();let heading='',body='';
    if(state.modal==='notes'){heading='Ghi chú cho người thuyết trình';body=`<p><strong>${c.header}:</strong> ${c.notes}</p><div class="divider-mark"></div><p><strong>Câu hỏi dành cho lớp:</strong> ${c.challenge.speaker}</p><p><strong>Kết luận:</strong> ${c.challenge.solution}</p><small>Ghi chú chỉ hiện khi bạn mở. Bấm N hoặc × để đóng.</small>`}
    else if(state.modal==='help'){heading='Hướng dẫn điều khiển';body=`<div class="brief-grid"><div class="brief-card"><b>→ / ←</b><p>Chuyển bước theo mạch thuyết trình, quay lại bước trước.</p></div><div class="brief-card"><b>N</b><p>Mở ghi chú của người dẫn. Nội dung này để bạn giảng thêm.</p></div><div class="brief-card"><b>F</b><p>Bật/tắt toàn màn hình. Bấm Esc để thoát.</p></div></div><p>Bạn quyết định khi nào mở câu hỏi. Cả lớp trả lời bằng lời nói, bạn thực hiện thao tác giải đố trên máy chiếu.</p>`}
    else if(state.modal==='pause'){heading='TẠM DỪNG – MỜI LỚP THẢO LUẬN';body=`<p style="font-family:Georgia,serif;font-size:26px;color:#f3d1a1">${c.challenge.speaker}</p><p>Sau khi nghe câu trả lời, hãy đóng màn hình này và tiếp tục thao tác trên trò chơi.</p>`}
    else if(state.modal==='sources'){heading='Nguồn ảnh tư liệu';body=`<p>Ảnh được nhúng từ Wikimedia Commons và giữ liên kết gốc. Có thể cần kết nối Internet khi trình chiếu.</p>${Object.values(photos).map(p=>`<p><a target="_blank" rel="noopener" href="${p.link}">${esc(p.label)}</a><br><small>${esc(p.by)}</small></p>`).join('')}<p>Khung phân tích được biên tập từ nội dung thuyết trình của nhóm, kết hợp kiến thức lịch sử phổ biến. Các sơ đồ và ngân sách trong game là minh họa, không phải bằng chứng thống kê.</p>`}
    else {heading='';body=''}
    return `<div class="modal-layer" role="presentation"><div class="modal show" role="dialog" aria-modal="true" aria-label="${heading}" ><button class="toolbtn close" data-action="closeModal" aria-label="Đóng">${ico('close')}</button><span class="eyebrow">HỒ SƠ 1991 / THÔNG TIN</span><h2>${heading}</h2>${body}<div class="actions" style="margin-top:20px"><button class="secondary" data-action="closeModal">Đóng</button></div></div></div>`;
  }
  function render(){if(state.page==='home')home();else if(state.page==='chapter')chapterScreen();else if(state.page==='lesson')lessonScreen();else if(state.page==='challenge')challengeScreen();else if(state.page==='debrief')debriefScreen();else ending()}
  function setPage(page){state.page=page;render()}
  function startChallenge(){state.challenge={};state.budget={def:35,tech:25,records:[]};setPage('challenge')}
  function next(){if(state.modal)return;if(state.page==='home'){state.chapter=0;setPage('chapter')}else if(state.page==='chapter'){state.beat=0;setPage('lesson')}else if(state.page==='lesson'){if(state.beat<2){state.beat++;render()}else startChallenge()}else if(state.page==='challenge')setPage('debrief');else if(state.page==='debrief'){if(state.chapter<4){state.chapter++;state.beat=0;setPage('chapter')}else setPage('end')}}
  function back(){if(state.modal)return;if(state.page==='lesson'){if(state.beat>0){state.beat--;render()}else setPage('chapter')}else if(state.page==='challenge'){state.beat=2;setPage('lesson')}else if(state.page==='debrief')setPage('challenge');else if(state.page==='chapter'){if(state.chapter===0)setPage('home');else{state.chapter--;setPage('debrief')}}else if(state.page==='end'){state.chapter=4;setPage('debrief')}}
  function check(ok,good,bad){state.challenge.ok=ok;state.challenge.feedback=ok?`<strong>Hồ sơ được giải mã.</strong> ${good}`:`<strong>Chưa khớp hoàn toàn.</strong> ${bad}`;render()}
  const actions={
    home(){state.chapter=0;state.beat=0;state.modal=null;setPage('home')},start(){state.chapter=0;setPage('chapter')},goto(v){state.chapter=Math.max(0,Math.min(4,Number(v)||0));state.beat=0;state.modal=null;setPage('chapter')},lesson(){state.beat=0;setPage('lesson')},nextLesson(){next()},prevLesson(){back()},lessonBack(){state.beat=2;setPage('lesson')},challenge(){setPage('challenge')},debrief(){setPage('debrief')},advance(){next()},resetChallenge(){state.challenge={};state.budget={def:35,tech:25,records:[]};render()},
    notes(){state.modal='notes';render()},pause(){state.modal='pause';render()},help(){state.modal='help';render()},sources(){state.modal='sources';render()},closeModal(){state.modal=null;render()},
    fullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>msg('Trình duyệt không cho phép toàn màn hình.'))}else document.exitFullscreen?.()},
    chainPick(v){const seq=state.challenge.seq||[];if(!seq.includes(v))state.challenge.seq=[...seq,v];state.challenge.feedback='';render()},
    chainCheck(){const seq=state.challenge.seq||[];check(seq.join(',')==='a,b,c,d','Bạn đã nối được cách một cơ chế quản lý có thể tạo ra sự trì trệ qua nhiều mắt xích.','Hãy tìm mắt xích bắt đầu từ quyết định tập trung, rồi lần theo tác động tới doanh nghiệp và hiệu quả.')},
    evidence(v){let a=state.challenge.selected||[];if(a.includes(v))a=a.filter(x=>x!==v);else if(a.length<3)a=[...a,v];else return msg('Chọn tối đa 3 chứng cứ.');state.challenge.selected=a;state.challenge.feedback='';render()},
    evidenceCheck(){const a=state.challenge.selected||[];check(a.length===3&&a.every(id=>evidences.find(e=>e.id===id).ok),'Ba chứng cứ là dấu hiệu của những hạn chế chính trị mang tính nội tại.','Phân biệt hạn chế quản trị với thành tựu khoa học, lựa chọn kinh tế hoặc sức ép quốc tế.')},
    pairLeft(v){state.challenge.from=v;state.challenge.feedback='';render()},
    pairRight(v){if(!state.challenge.from)return msg('Chọn một diễn biến bên trái trước.');const links={...(state.challenge.links||{})};for(const [k,old] of Object.entries(links))if(old===v)delete links[k];links[state.challenge.from]=v;state.challenge.links=links;state.challenge.from=null;state.challenge.feedback='';render()},
    pairCheck(){const l=state.challenge.links||{};check(l.l1==='r1'&&l.l2==='r2'&&l.l3==='r3','Các diễn biến được ghép với những hệ quả hoặc vấn đề có liên hệ. Đây là mạng lưới tương tác, không phải chuỗi tất định.','Hãy xem lại: kinh tế – phân phối; công khai – phản biện; trung ương – chủ quyền.')},
    saveBudget(){const b=state.budget,rest=100-b.def-b.tech;if(rest<0)return msg('Tổng đã vượt 100. Giảm một trong hai mục ưu tiên.');if(b.records.length>=2)return;const rec={def:b.def,tech:b.tech,rest};if(b.records.length===1&&JSON.stringify(b.records[0])===JSON.stringify(rec))return msg('Hãy thử phương án thứ hai khác phương án A.');b.records.push(rec);state.challenge.feedback='';render()},
    budgetCompare(){const b=state.budget;if(b.records.length!==2)return;const r1=b.records[0],r2=b.records[1];const d=r2.def-r1.def,t=r2.tech-r1.tech,p=r2.rest-r1.rest;state.challenge.ok=true;state.challenge.feedback=`<strong>Hai phương án tạo ra hai cấu trúc đánh đổi.</strong> Quốc phòng thay đổi ${d>0?'+':''}${d}; công nghệ ${t>0?'+':''}${t}; dân sinh ${p>0?'+':''}${p}. Không thể suy ra từ các con số giả định rằng một phương án sẽ “cứu được Liên Xô”.`;render()},
    rolePick(v){state.challenge.roleSelected=v;state.challenge.feedback='';render()},
    rolePlace(v){if(!state.challenge.roleSelected)return msg('Bấm chọn một hồ sơ nguyên nhân ở hàng trên trước.');const map={...(state.challenge.roles||{})};for(const [k,old] of Object.entries(map))if(old===state.challenge.roleSelected)delete map[k];map[v]=state.challenge.roleSelected;state.challenge.roles=map;state.challenge.roleSelected=null;state.challenge.feedback='';render()},
    roleCheck(){const map=state.challenge.roles||{};check(Object.keys(map).length===4&&roles.every(r=>map[r.id]===r.id),'Bốn nhóm nguyên nhân giữ những vai trò khác nhau nhưng tác động qua lại. Đánh giá lịch sử cần đặt chúng trong cùng một bức tranh.','Thử phân biệt: yếu kém kinh tế, cơ chế phản hồi chính trị, tác nhân tăng bất ổn khi cải tổ, và sức ép từ bên ngoài.')}
  };
  root.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;const fn=actions[a];if(fn){fn(el.dataset.value);}});
  root.addEventListener('input',e=>{if(!e.target.matches('[data-range]'))return;let b=state.budget;const n=Number(e.target.value);if(e.target.dataset.range==='def'){b.def=n;if(b.def+b.tech>95)b.tech=95-b.def;}else{b.tech=n;if(b.def+b.tech>95)b.def=95-b.tech;}const def=document.querySelector('[data-range="def"]'),tech=document.querySelector('[data-range="tech"]');if(def)def.value=b.def;if(tech)tech.value=b.tech;['val-def','val-tech'].forEach((id,i)=>{const el=document.getElementById(id);if(el)el.textContent=i?b.tech:b.def});const rest=100-b.def-b.tech;['val-rest','rest-big'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=rest});});
  document.addEventListener('keydown',e=>{const t=e.target;if(['INPUT','TEXTAREA','SELECT'].includes(t.tagName))return;if(e.key==='Escape'&&state.modal){state.modal=null;render();return}if(e.key==='n'||e.key==='N'){e.preventDefault();state.modal=state.modal==='notes'?null:'notes';render();return}if(e.key==='f'||e.key==='F'){e.preventDefault();actions.fullscreen();return}if(e.key==='?'){e.preventDefault();state.modal='help';render();return}if(state.modal)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();next()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back()}});
  render();
})();

</script>
</body>
</html>
